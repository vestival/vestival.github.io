  <script>
    const html = document.documentElement;

    // Theme
    const toggle = document.getElementById('themeToggle');
    const savedTheme = localStorage.getItem('theme') || 'light';
    html.setAttribute('data-theme', savedTheme);
    toggle.addEventListener('click', () => {
      const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
    });

    // Font size – 100% to 300% in 25% steps
    const ZOOM_LEVELS = [1, 1.25, 1.5, 1.75, 2.0, 2.25, 2.5, 2.75, 3.0];
    let zoomIndex = parseInt(localStorage.getItem('font-level') || '0', 10);
    const fontDown = document.getElementById('fontDown');
    const fontUp   = document.getElementById('fontUp');
    function applyZoom() {
      document.body.style.zoom = ZOOM_LEVELS[zoomIndex];
      localStorage.setItem('font-level', zoomIndex);
      fontDown.disabled = zoomIndex === 0;
      fontUp.disabled   = zoomIndex === ZOOM_LEVELS.length - 1;
    }
    applyZoom();
    fontDown.addEventListener('click', () => { if (zoomIndex > 0) { zoomIndex--; applyZoom(); } });
    fontUp.addEventListener('click',   () => { if (zoomIndex < ZOOM_LEVELS.length - 1) { zoomIndex++; applyZoom(); } });
  </script>
